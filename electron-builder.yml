appId: win.aisuper.desktop-pet
productName: Desktop Pet
electronDist: node_modules/electron/dist
directories:
  output: release
files:
  - src/**
  - dist/**
  - package.json
  - node_modules/ffmpeg-static/**/*
asarUnpack:
  - node_modules/ffmpeg-static/**/*
mac:
  target:
    - dmg
  extendInfo:
    LSUIElement: true
  artifactName: Desktop-Pet-mac.${ext}
win:
  target:
    - nsis
  artifactName: Desktop-Pet-windows.${ext}
